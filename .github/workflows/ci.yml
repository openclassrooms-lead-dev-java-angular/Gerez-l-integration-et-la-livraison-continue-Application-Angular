name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      # 1. Code recovery
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Project type detection
      - name: Detect project type
        id: detect
        shell: bash
        run: |
          if [[ -f "gradlew" ]]; then
            echo "project=java" >> "$GITHUB_OUTPUT"
          elif [[ -f "package.json" ]] && grep -q '"@angular/core"' package.json; then
            echo "project=angular" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported project type"
            exit 1
          fi

      # ==========================================
      # JAVA / GRADLE
      # ==========================================

      - name: Set up Java
        if: steps.detect.outputs.project == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: steps.detect.outputs.project == 'java'
        uses: gradle/actions/setup-gradle@v4

      - name: Run Java tests
        if: steps.detect.outputs.project == 'java'
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      # ==========================================
      # ANGULAR / NODE.JS
      # ==========================================

      - name: Set up Node.js
        if: steps.detect.outputs.project == 'angular'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install Angular dependencies
        if: steps.detect.outputs.project == 'angular'
        run: npm ci

      - name: Run Angular tests
        if: steps.detect.outputs.project == 'angular'
        shell: bash
        run: |
          rm -rf test-results
          mkdir -p test-results
          npm test

      # ==========================================
      # TEST REPORT
      # ==========================================

      - name: Publish Angular test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Angular test results
          path: test-results/TESTS-angular.xml
          reporter: java-junit
          fail-on-error: false

  # ==========================================
  # RELEASE + DOCKER
  # ==========================================

  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --------------------------------------
      # SEMANTIC RELEASE
      # --------------------------------------

      - name: Create GitHub Release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx --no-install semantic-release

      # --------------------------------------
      # DOCKER
      # --------------------------------------

      - name: Set Docker image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
